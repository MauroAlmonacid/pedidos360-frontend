server {
    # Nginx escucha en el puerto web estándar 80
    listen 80;
    server_name localhost;

    # Carpeta raíz donde vivirán los archivos HTML y JS compilados
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Redirige cualquier ruta interna (como /ordenes o /productos) al index.html
        try_files $uri $uri/ /index.html;
    }

    # Desactiva la memoria caché en index.html para que el navegador descargue siempre lo último
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Manejo estándar de errores de servidor
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}